# AMOLED: true black, so the page disappears on an OLED screen and only the content
# is lit. Also the least tiring thing to read at night, which is when this gets used.
[theme]
base = "dark"
primaryColor = "#34D399"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0B0B0D"
textColor = "#EDEDF0"
font = "sans serif"

[browser]
gatherUsageStats = false
