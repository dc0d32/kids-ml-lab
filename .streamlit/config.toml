# Dark by default. The kids will be reading this at night, and a white page at
# full brightness is the fastest way to end a session early.
[theme]
base = "dark"
primaryColor = "#34D399"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#171B26"
textColor = "#E6EDF3"
font = "sans serif"

[browser]
gatherUsageStats = false
