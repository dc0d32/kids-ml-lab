[project]
name = "kids-ml-lab"
version = "0.1.0"
description = "An interactive, hands-on machine learning crash course for kids"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "plotly>=5.22",
    "streamlit>=1.36",
    "streamlit-drawable-canvas>=0.9.3",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "pillow>=10.3",
    "torch>=2.3",
    "torchvision>=0.18",
    "streamlit-mermaid>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kidsml"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
